[project]
name = "person-agents"
version = "0.1.0"
description = "Production-grade personal agent with multi-agent orchestration"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "structlog>=24.0",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "aiosqlite>=0.22.1",
    "fastapi>=0.143.2",
    "uvicorn>=0.54.0",
    "redis>=8.1.0",
    "prometheus-client>=0.26.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "asyncpg>=0.32.0",
    "anyio==4.11.0",
]

[project.optional-dependencies]
memory = ["chromadb>=0.5", "alembic>=1.13", "aiosqlite>=0.19"]
graph = ["langgraph>=0.2", "langgraph-checkpoint-sqlite>=1.0"]
obs = ["langfuse>=2.0"]
sandbox = ["docker>=7.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
security = ["pip-audit>=2.7"]

[project.scripts]
person-agents = "person_agents.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/person_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
